{% extends 'base.html' %}
{% block content %}
<h2>Add Doctor</h2>
<form method="POST">
    Name: <input type="text" name="name"><br>
    Specialization: <input type="text" name="specialization"><br>
    Department:
    <select name="department">
        {% for dept in departments %}
        <option value="{{ dept.DepartmentID }}">
            {{ dept.DepartmentName }}
        </option>
        {% endfor %}
    </select>
    <button type="submit">Add</button>
</form>
{% endblock %}
