<!DOCTYPE html>
<html>
<head>
    <title>Food Delivery System</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #ff6a00, #ee0979);
            color: white;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            padding: 20px 50px;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 600;
            transition: 0.3s;
        }

        .navbar a:hover {
            color: yellow;
        }

        .container {
            padding: 40px;
            text-align: center;
        }

        .card {
            display: inline-block;
            width: 280px;
            margin: 20px;
            padding: 25px;
            border-radius: 20px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-10px);
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            background: white;
            color: #ee0979;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: yellow;
            color: black;
        }

        h1, h2 {
            margin: 10px 0;

        }
        button {
            background: orange;
            border: none;
            padding: 8px 15px;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: darkorange;
        }
    </style>
</head>
<body>

<div class="navbar">
    <h2>🍔 FoodieExpress</h2>
    <div>
        <a href="/">Home</a>
        <a href="/cart">Cart</a>
        <a href="/orders">My Orders</a>
    </div>
</div>

<div class="container">
    {% block content %}{% endblock %}
</div>

</body>
</html>
