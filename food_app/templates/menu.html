{% extends "base.html" %}
{% block content %}

<h1>Menu</h1>

<div style="display:flex; flex-wrap:wrap; gap:20px;">
{% for food in foods %}
    <div style="border:1px solid #ddd; padding:15px; width:250px; border-radius:10px;">
        
        <img src="{{ food_images.get(food.name) }}"
             width="100%"
             height="150"
             style="object-fit:cover; border-radius:10px;">

        <h3>{{ food.name }}</h3>
        <p>₹ {{ food.price }}</p>

        <a href="{{ url_for('add_to_cart', food_id=food.food_id) }}">
            <button>Add to Cart</button>
        </a>
    </div>
{% endfor %}
</div>

{% endblock %}
