{% extends "base.html" %}
{% block content %}

<h1>Your Cart</h1>

{% for item in cart_items %}
<div class="card">
    <h2>{{ item.name }}</h2>
    <p>Quantity: {{ item.quantity }}</p>
    <p>Subtotal: ₹{{ item.subtotal }}</p>
</div>
{% endfor %}

<a href="/place_order">
    <button>Place Order</button>
</a>

{% endblock %}
