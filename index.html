<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather Forecast Application</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <div class="weather-card">
            <h1>🌤 Weather Forecast</h1>
            <p class="subtitle">Get real-time weather updates for any city</p>

            <div class="input-group">
                <input type="text" id="cityInput" placeholder="Enter city name">
                <button onclick="getWeather()">Search</button>
            </div>
            <img id="weatherImage" src="" alt="Weather Image" class="weather-img">


            <div id="weatherResult" class="result-box"></div>
        </div>
    </div>

<script src="script.js"></script>
</body>
</html>
